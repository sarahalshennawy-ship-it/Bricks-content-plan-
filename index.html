<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bricks — Content Plan Generator</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
body{background:radial-gradient(circle at 10% 0%,#FBE6EF 0,transparent 420px) no-repeat,#FFFBF8;min-height:100vh;color:#363731}
#app{max-width:600px;margin:0 auto;padding:0 0 40px;position:relative}
.hdr{background:#7A1F5C;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-radius:0 0 0 0}
.hb{font-size:16px;font-weight:600;color:#fff}
.hs{font-size:10px;color:#FFC857;letter-spacing:1px;margin-top:1px}
.hbtn{background:transparent;border:0.5px solid rgba(255,255,255,0.35);color:rgba(255,255,255,0.9);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:11px}
.body{padding:22px 16px}
.pr{display:flex;justify-content:space-between;margin-bottom:5px}
.pl{font-size:12px;font-weight:600;color:#7A1F5C}
.pp{font-size:12px;color:#888}
.pbar{height:3px;background:#EDE2DB;border-radius:3px;overflow:hidden;margin-bottom:20px}
.pfill{height:100%;background:#7A1F5C;border-radius:3px;transition:width 0.3s}
.qt{font-size:18px;font-weight:600;color:#363731;margin-bottom:4px;line-height:1.3}
.qh{font-size:12px;color:#888;margin-bottom:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:4px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:4px}
.gcol{display:flex;flex-direction:column;gap:7px;margin-bottom:4px}
.ob{padding:11px 12px;border-radius:8px;border:1.5px solid #EDE2DB;background:#fff;color:#363731;font-size:13px;cursor:pointer;text-align:left;line-height:1.3;transition:all 0.12s;width:100%}
.ob.sel{border-color:#7A1F5C;background:#FBEFF4;color:#7A1F5C;font-weight:600}
.ob:active{transform:scale(0.98)}
.lo{padding:13px 15px;border-radius:8px;border:1.5px solid #EDE2DB;background:#fff;cursor:pointer;text-align:left;transition:all 0.12s;width:100%;margin-bottom:7px;display:block}
.lo.sel{border-color:#7A1F5C;background:#FBEFF4}
.lo-t{font-size:14px;font-weight:600;color:#363731}
.lo.sel .lo-t,.lo.sel .lo-s{color:#7A1F5C}
.lo-s{font-size:11px;color:#888;margin-top:2px}
.dta{width:100%;min-height:110px;padding:11px;border-radius:8px;border:1.5px solid #EDE2DB;font-size:13px;line-height:1.6;color:#363731;background:#fff;resize:vertical;outline:none}
.dta:focus{border-color:#7A1F5C}
.cc{font-size:11px;color:#888;margin-top:4px}
.nav{display:flex;justify-content:space-between;margin-top:20px;align-items:center}
.btnb{padding:9px 16px;border-radius:8px;border:1.5px solid #EDE2DB;background:#fff;color:#363731;font-size:13px;cursor:pointer}
.btnn{padding:9px 18px;border-radius:8px;border:none;background:#7A1F5C;color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.btnn:disabled,.btng:disabled{opacity:0.35;cursor:not-allowed}
.btng{padding:10px 18px;border-radius:8px;border:none;background:#7A1F5C;color:#fff;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px}
.spin{width:12px;height:12px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:sp 0.7s linear infinite;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}
.selc{font-size:11px;color:#D14B7F;margin-top:6px}
.errbox{margin-top:10px;padding:10px 12px;background:#FFF0EE;border:1px solid #C2413B;border-radius:8px;color:#C2413B;font-size:12px}
.gprog{background:#FBEFF4;border-radius:8px;padding:12px 14px;margin-top:12px}
.gptext{font-size:12px;color:#666;margin-bottom:7px;text-align:center}
.gpbar{height:5px;background:#ddd;border-radius:5px;overflow:hidden}
.gpfill{height:100%;background:#7A1F5C;border-radius:5px;transition:width 0.4s}
.lp{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:150px 20px 40px;text-align:center}
.corner-lockup{position:absolute;top:24px;inset-inline-start:24px}

[dir=rtl] .corner-logo{background-position:right center}
.corner-word{font-family:Georgia,'Times New Roman',serif;font-size:17px;font-weight:600;letter-spacing:2px;color:#fff;line-height:1.2}
.corner-tag{font-size:7px;font-weight:600;letter-spacing:0.8px;color:rgba(255,255,255,0.8);margin-top:1px}
.lp-title{font-size:40px;font-weight:800;color:#363731;margin-bottom:14px;line-height:1.25}
.lpc{display:flex;gap:12px;justify-content:center;margin-top:24px}
.lpcbtn{flex:1;max-width:160px;padding:18px 12px;border-radius:12px;border:2px solid #EDE2DB;background:#fff;cursor:pointer;box-shadow:0 6px 18px rgba(122,31,92,0.08);text-align:center;transition:all 0.15s}
.lpcbtn:hover{border-color:#D14B7F;background:#fff}
.lpcbtn-m{font-size:19px;font-weight:600;color:#363731;margin-bottom:3px}
.lpcbtn-s{font-size:11px;color:#6E6A63}
.phdr{background:#7A1F5C;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.pbody{padding:14px}
.sumcard{background:linear-gradient(135deg,#4A1242 0%,#7A1F5C 100%);border-radius:10px;padding:16px;margin-bottom:12px}
.sumt{font-size:16px;font-weight:600;color:#fff;margin-bottom:6px}
.sums{font-size:13px;color:#F6DDE8;line-height:1.6;margin-bottom:10px}
.pills{display:flex;gap:5px;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:600}
.sumcard .pill{background:rgba(255,255,255,0.14)!important;color:#FFE2A8!important}
.wklbl{padding:6px 12px;background:#7A1F5C;border-radius:8px 8px 0 0;font-size:11px;font-weight:600;color:#FFC857;letter-spacing:0.5px}
.wkblk{background:#FBEFF4;border-radius:0 0 8px 8px;padding:7px 7px 2px;margin-bottom:10px}
.dcard{background:#fff;border:1px solid #EDE2DB;border-radius:8px;padding:12px 14px;margin-bottom:6px}

.calmonth{margin-bottom:20px}
.calmonthtitle{font-size:14px;font-weight:700;color:#363731;margin-bottom:8px;padding:0 2px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calwdgrid{margin-bottom:4px}
.calwd{text-align:center;font-size:10px;font-weight:700;color:#888;padding:4px 0}
.calcell{aspect-ratio:1;border-radius:6px;padding:4px;overflow:hidden;display:flex;flex-direction:column;min-height:56px}
.calcell.empty{background:#FDF7F4}
.calcell.filled{background:#fff;border:1px solid #EDE2DB;cursor:pointer;transition:all 0.12s}
.calcell.filled:hover{border-color:#7A1F5C;box-shadow:0 2px 8px rgba(122,31,92,0.15);transform:translateY(-1px)}
.calnum{font-size:10px;font-weight:700;color:#363731;margin-bottom:2px}
.calhook{font-size:8.5px;line-height:1.25;color:#333;flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.calfmt{font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;margin-top:2px}
.calhint{text-align:center;font-size:12px;color:#888;margin:8px 0 16px}

.modaloverlay{position:fixed;inset:0;background:rgba(26,26,26,0.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modalcard{background:#fff;border-radius:14px;padding:22px;max-width:440px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.modaltop{display:flex;justify-content:space-between;align-items:flex-start}
.modaldate{font-size:12px;color:#888}
.modaldaynum{font-size:18px;font-weight:800;margin-top:2px}
.modalclose{background:#FBEFF4;border:none;border-radius:50%;width:32px;height:32px;font-size:14px;cursor:pointer;color:#363731;flex-shrink:0}
.modalclose:hover{background:#EDE2DB}
.dtop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.dmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dnum{font-size:12px;font-weight:600;min-width:42px}
.dpill{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600}
.cpbtn{padding:3px 9px;border-radius:6px;border:1px solid #7A1F5C;background:transparent;color:#7A1F5C;font-size:10px;cursor:pointer;white-space:nowrap}
.cpbtn.ok{background:#D14B7F;border-color:#D14B7F;color:#fff}
.flbl{font-size:10px;font-weight:600;letter-spacing:0.4px;margin-bottom:2px}
.fval{font-size:13px;color:#363731;line-height:1.5}
.fhook{font-size:13px;font-weight:600;color:#363731;line-height:1.5}
.fdiv{border:none;border-top:1px solid #F3E8E4;margin:6px 0}
.ctabox{background:#7A1F5C;border-radius:10px;padding:16px;margin-top:4px}
@keyframes ctaPulseCP{
0%,100%{box-shadow:0 8px 24px rgba(255,200,87,0.25),0 0 0 0 rgba(255,200,87,0.5)}
50%{box-shadow:0 8px 30px rgba(255,200,87,0.45),0 0 0 8px rgba(255,200,87,0)}
}
.ctabtn{display:inline-block;padding:13px 26px;font-weight:800;font-size:14px;border-radius:9px;text-decoration:none;border:0;transition:transform 0.2s}
.ctabtn:hover{transform:translateY(-1px)}
.ctat{font-size:14px;font-weight:600;color:#fff;margin-bottom:4px}
.ctas{font-size:12px;color:rgba(255,255,255,0.85);line-height:1.6}
@media (max-width: 768px){
.lp{padding:120px 16px 30px}
.corner-mark{width:44px;height:55px}
.corner-word{font-size:14px}
.corner-tag{font-size:6px}
.lp-title{font-size:28px}
.g3{grid-template-columns:1fr 1fr}
.lpc{gap:8px}
.lpcbtn{max-width:140px;padding:14px 8px}
.lpcbtn-m{font-size:16px}
.qt{font-size:16px}
.dcard{padding:10px 12px}
.ctabox{padding:14px}
.ctat{font-size:13px}
.ctas{font-size:11px}
.sumcard{padding:14px}
.sumt{font-size:15px}
}
@media (max-width: 400px){
.corner-logo{width:130px;height:52px}
.lp{padding:95px 14px 24px}
.corner-lockup{top:14px;inset-inline-start:14px}
.corner-mark{width:34px;height:43px}
.corner-word{font-size:11px}
.corner-tag{font-size:5px}
.lp-title{font-size:21px}
.g2{grid-template-columns:1fr}
.g3{grid-template-columns:1fr 1fr}
.lo-t{font-size:13px}
.lpcbtn{max-width:130px;padding:12px 6px}
.lpcbtn-m{font-size:15px}
.lpcbtn-s{font-size:10px}
.hb{font-size:14px}
.hs{font-size:9px}
}
.printonly{display:none}
@media print{
body{background:#fff !important}
.no-print{display:none !important}
.calmonth,.sumcard,.pills{display:none !important}
.printonly{display:block !important}
.printheader{text-align:center;margin-bottom:24px;border-bottom:2px solid #7A1F5C;padding-bottom:16px}
.printheader h1{font-size:22px;color:#363731;margin-bottom:6px}
.printsummary{font-size:13px;color:#555}
.printday{page-break-inside:avoid;border:1px solid #EDE2DB;border-radius:8px;padding:12px 14px;margin-bottom:10px}
.printdaytop{font-weight:700;font-size:13px;color:#7A1F5C;margin-bottom:6px}
.printfmt{font-size:10px;color:#D14B7F;font-weight:700;text-transform:uppercase}
.printfield{font-size:11px;color:#363731;margin-bottom:4px;line-height:1.4}
.printfooter{text-align:center;font-size:10px;color:#888;margin-top:20px}
}

/* ===== plan / tracker tabs ===== */
.vtabs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;background:#fff;border:1.5px solid #EDE2DB;border-radius:999px;padding:4px;margin:0 auto 18px;width:max-content;max-width:100%}
.vtab{border:0;background:none;padding:9px 18px;border-radius:999px;font-size:14px;font-weight:600;color:#6E6A63;cursor:pointer}
.vtab[aria-selected="true"]{background:#7A1F5C;color:#fff}
.robanner{background:#FFF5DE;border:1px solid #F1D48A;color:#6B4E00;border-radius:12px;padding:12px 14px;font-size:13.5px;margin:0 0 16px;text-align:center}
.trstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.trstat{background:#fff;border:1.5px solid #EDE2DB;border-radius:12px;padding:12px;text-align:center}
.trstat b{display:block;font-size:22px;color:#363731}
.trstat span{font-size:12px;color:#6E6A63}
.trcard{background:#fff;border:1.5px solid #EDE2DB;border-radius:14px;padding:16px;margin-bottom:14px}
.trcard h4{font-size:14px;margin:0 0 10px;color:#363731}
.trnote{font-size:13px;color:#6E6A63}
.trbar{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.trbar i{display:block;height:10px;border-radius:6px;background:#D14B7F;min-width:4px}
.trtop{font-size:13px;margin:6px 0;display:flex;gap:8px}
.trtop b{white-space:nowrap}
.trtop span{color:#6E6A63;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.trai{white-space:pre-wrap;font-size:14px;line-height:1.6;color:#363731;background:#FBEFF4;border-radius:10px;padding:12px 14px;margin-top:10px}
.trsave{font-size:12px;color:#6E6A63;text-align:end;min-height:16px;margin-bottom:6px}
.trrow{background:#fff;border:1.5px solid #EDE2DB;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.trrow.done{border-color:#B9D7C6;background:#FBFEFC}
.trhead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.trhead b{font-size:14px}
.trfmt{color:#7A1F5C;font-weight:600;margin-inline-start:8px}
.trposted{display:flex;align-items:center;gap:6px;font-weight:600;color:#363731;cursor:pointer}
.trposted input{width:18px;height:18px;accent-color:#2E7D62}
.trhook{font-size:13.5px;color:#363731;margin:6px 0 10px;cursor:pointer;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.trhook:hover{color:#7A1F5C}
.trnums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.trnums label{font-size:11.5px;color:#6E6A63;display:block;margin-bottom:3px}
.trnums input{width:100%;padding:8px 10px;border:1.5px solid #EDE2DB;border-radius:8px;font-size:15px;direction:ltr;text-align:start}
.trnums input:focus{outline:none;border-color:#9C2A63}
@media (max-width:560px){.trstats{grid-template-columns:repeat(2,1fr)}.trnums{grid-template-columns:repeat(2,1fr)}.trbar{grid-template-columns:90px 1fr auto}}
@media print{.vtabs,.trwrap,.robanner{display:none!important}}

n and calendar"},{q:"What type of business do you run?",h:"Pick up to 2 that match best"},{q:"What is your main goal right now?",h:"Pick up to 2 — the most urgent"},{q:"Where do you post your content?",h:"Select all that apply"},{q:"Who is your target audience?",h:"Select all that apply"},{q:"What language should your content be in?",h:"Hooks and captions will be in this language"},{q:"Describe your business briefly",h:"What do you sell? What makes you different? What city?"},{q:"What do you sell, and what stops people buying?",h:"Your real services and prices, and the doubts customers have. This is what makes your plan specific."},{q:"How much can you realistically do?",h:"Your plan is built around this, so it's actually doable."},{q:"Let's look at your account",h:"Optional, but it makes the plan much more specific. Skip it if your account is new."}],ar:[{q:"ما اسم شركتك؟",h:"هذا يخصص خطتك وتقويمك باسمك"},{q:"ما نوع بزنسك؟",h:"اختر حتى 2 من الأقرب لطبيعة عملك"},{q:"ما هو هدفك الرئيسي الآن؟",h:"اختر حتى 2 — الأهم والأكثر إلحاحاً"},{q:"وين تنشر محتواك؟",h:"اختر كل ما ينطبق"},{q:"من هو جمهورك المستهدف؟",h:"اختر كل ما ينطبق"},{q:"بأي لغة تريد توليد المحتوى؟",h:"الهوكات والكابشنات ستُكتب بهذه اللغة"},{q:"اوصف بزنسك باختصار",h:"إيش تبيع؟ إيش يميزك؟ في أي مدينة؟"},{q:"ماذا تبيع، وما الذي يمنع الناس من الشراء؟",h:"خدماتك وأسعارك الفعلية، والتردد الذي يبديه العملاء. هذا ما يجعل خطتك دقيقة."},{q:"ما الذي يمكنك تنفيذه فعلياً؟",h:"تُبنى خطتك على هذا، لتكون قابلة للتنفيذ فعلاً."},{q:"لنلقِ نظرة على حسابك",h:"اختياري، لكنه يجعل الخطة أدق بكثير. تخطَّ هذه الخطوة إذا كان حسابك جديداً."}]},pillars:{en:["Authority","Social Proof","Behind Scenes","Offer","Entertainment"],ar:["سلطة","دليل اجتماعي","كواليس","عرض","ترفيه"]}};

  String(txt||"").split("\n").forEach(function(line){var i=line.indexOf(":");if(i<0)return;var k=line.slice(0,i).trim().toUpperCase().replace(/[^A-Z0-9]/g,"");var v=line.slice(i+1).trim();if(!v)return;
    if(k==="WORKING")s.working.push(v);else if(k==="NOTWORKING")s.notWorking.push(v);else if(k==="CHANGE")s.change.push(v);else if(k==="STRATEGY")s.strategy=v;
    else if(/^WEEK[1-4]$/.test(k))s.weeks[+k.slice(4)-1]=v;
    else if(k==="REPORT")s.report.push(v);
    else if(k==="TIP"){var bar=v.indexOf("|");if(bar>0)s.tips.push({cat:v.slice(0,bar).trim().toUpperCase(),text:v.slice(bar+1).trim()});else s.tips.push({cat:"GROWTH",text:v});}
    else if(k==="MIX"){var m={};v.replace(/(REELS|CAROUSELS|POSTS|STORIES)\s*=\s*(\d+)/gi,function(_,a,b){m[a.toUpperCase()]=+b;});s.mix=m;}});
  return s;
}
function normalizeMix(m){
  var hi=capIndex("hours");var maxReels=REEL_CAP[hi<0?1:hi];
  var mix={Reel:(m&&m.REELS)||10,Carousel:(m&&m.CAROUSELS)||8,Post:(m&&m.POSTS)||6,Story:(m&&m.STORIES)||6};
  if(mix.Reel>maxReels){mix.Carousel+=mix.Reel-maxReels;mix.Reel=maxReels;}
  var keys=["Reel","Carousel","Post","Story"],sum=keys.reduce(function(a,k){return a+Math.max(0,mix[k]);},0)||1;
  var out={},acc=0;keys.forEach(function(k){out[k]=Math.floor(Math.max(0,mix[k])*30/sum);acc+=out[k];});
  var i=0;while(acc<30){out[keys[i%4]]++;acc++;i++;}
  return out;
}
/* spread formats evenly across the days instead of clumping them */
function spreadFormats(mix,n){
  var keys=Object.keys(mix).filter(function(k){return mix[k]>0;}),tot=keys.reduce(function(a,k){return a+mix[k];},0)||1;
  var due={},left={},out=[];keys.forEach(function(k){left[k]=Math.round(mix[k]*n/tot);due[k]=n/(2*Math.max(1,left[k]));});
  for(var i=0;i<n;i++){var best=null;keys.forEach(function(k){if(left[k]>0&&(best===null||due[k]<due[best]))best=k;});if(!best)best="Post";out.push(best);left[best]--;due[best]+=n/Math.max(1,mix[best]*n/tot);}
  return out;
}
function weekOf(day){for(var i=0;i<4;i++){if(day>=WEEKS[i][0]&&day<=WEEKS[i][1])return i;}return 3;}

function parseDays(text,specs){
  var map={DAY:"day",FORMAT:"format",HOOK:"hook",ONSCREEN:"onscreen",SCRIPT:"script",SHOTS:"shots",SLIDES:"slides",DESIGN:"design",IMAGE:"image",FRAMES:"frames",STICKER:"sticker",CAPTION:"caption",CTA:"cta",HASHTAGS:"hashtags",TIME:"time",EFFORT:"effort"};
  var out={};String(text||"").split(/\n\s*---+\s*\n?|^---+$/m).forEach(function(block){
    var o={};block.split("\n").forEach(function(line){var i=line.indexOf(":");if(i<0)return;var k=line.slice(0,i).trim().toUpperCase().replace(/[^A-Z]/g,"");var f=map[k];if(!f)return;var v=line.slice(i+1).trim();if(f==="day"){var n=parseInt(v,10);if(!isNaN(n))o.day=n;}else if(f==="effort"){var e=parseInt(v,10);if(!isNaN(e))o.effort=e;}else o[f]=v;});
    if(o.day&&(o.hook||o.caption))out[o.day]=o;});
  return specs.map(function(sp){var d=out[sp.day];if(!d)return null;d.day=sp.day;d.format=sp.format;if(d.shots)d.visual=d.shots;return d;});
}
function placeholderDay(sp,ar){return{day:sp.day,format:sp.format,hook:v2T(ar).failedDay,caption:"",cta:"",failed:true};}
async function generateDays(specs,snap,usedHooks,extra,onBatch){
  var ar=isAR(),result=[];
  for(var i=0;i<specs.length;i+=4){
    var batch=specs.slice(i,i+4);if(onBatch)onBatch(batch[0].day,batch[batch.length-1].day,i/specs.length);
    var parsed=[];
    for(var attempt=0;attempt<2;attempt++){
      var raw=await callAPI(dayPrompt(batch,snap,usedHooks,extra),2300);
      parsed=parseDays(raw,batch);if(parsed.filter(Boolean).length>=batch.length-1)break;
    }
    batch.forEach(function(sp,j){var d=parsed[j]||placeholderDay(sp,ar);if(d.hook&&!d.failed)usedHooks.push(String(d.hook).slice(0,80));result.push(d);});
  }
  return result;
}

  var dateStr=dateObj?dateObj.toLocaleDateString(ar?"ar":"en",{weekday:'long',month:'long',day:'numeric'}):"";
  var extra="";
  if(d.script)extra+='<div class="fdiv"></div><div class="flbl" style="color:#A36B00">'+sL+'</div><div class="fval" style="text-align:'+ta+'">'+esc(d.script)+'</div>';
  if(d.visual)extra+='<div class="fdiv"></div><div class="flbl" style="color:#12A383">'+vL+'</div><div class="fval" style="text-align:'+ta+'">'+esc(d.visual)+'</div>';
  if(d.hashtags)extra+='<div class="fdiv"></div><div class="flbl" style="color:#5B5BD6">'+tagL+'</div><div class="fval" style="text-align:'+ta+';opacity:0.8">'+esc(d.hashtags)+'</div>';
  var timeTag=d.time?'<span class="dpill" style="background:#FFC85733;color:#8A5A00">⏰ '+esc(d.time)+'</span>':'';
  var root=$id("dayModalRoot");
  root.innerHTML='<div class="modaloverlay" id="modalOverlay"><div class="modalcard">'+
    '<div class="modaltop"><div><div class="modaldate">'+esc(dateStr)+'</div><div class="modaldaynum" style="color:'+pc+'">'+(ar?"اليوم ":"Day ")+d.day+'</div></div><button class="modalclose" id="modalCloseBtn">✕</button></div>'+
    '<div class="dmeta" style="margin:10px 0"><span class="dpill" style="background:'+pc+'22;color:'+pc+'">'+DATA.pillars[isAR()?"ar":"en"][pi]+'</span>'+(d.format?'<span class="dpill" style="background:#D14B7F22;color:#D14B7F">'+esc(d.format)+'</span>':'')+timeTag+'</div>'+
    dayBodyHTML(d,ar)+(d.effort?'<div class="fdiv"></div><div class="flbl" style="color:#6E6A63">'+v2T(ar).effort+'</div><div class="fval">~'+d.effort+' '+v2T(ar).minutes+'</div>':'')+
    '<button class="cpbtn" id="modalCopyBtn" style="margin-top:16px;width:100%;padding:10px">'+cpL+'</button>'+
    '<button class="btnb no-print" id="modalTrackBtn" style="margin-top:8px;width:100%;padding:10px">📊 '+trT(ar).logThis+'</button>'+(S.readOnly?'':'<button class="btnb" id="modalRegenBtn" style="margin-top:8px;width:100%;padding:10px">'+rgL+'</button>')+
    '<div id="modalRegenError" style="display:none;margin-top:8px;padding:8px 12px;background:rgba(194,65,59,0.1);border:1px solid #C2413B;border-radius:8px;color:#C2413B;font-size:12px"></div>'+
  '</div></div>';
  $id("modalOverlay").addEventListener("click",function(e){if(e.target.id==="modalOverlay")closeDayModal();});
  $id("modalCloseBtn").addEventListener("click",closeDayModal);
  $id("modalTrackBtn").addEventListener("click",function(){closeDayModal();S.view="tracker";render();var r=$id("tr-"+d.day);if(r){r.scrollIntoView({block:"center"});var f=r.querySelector("input[data-f=views]");if(f)f.focus();}});
  if($id("modalRegenBtn"))$id("modalRegenBtn").addEventListener("click",async function(){
    var btn=$id("modalRegenBtn");var errBox=$id("modalRegenError");
    btn.disabled=true;btn.textContent=rgLoadL;errBox.style.display="none";
    try{
      var newD=await regenerateDay(d);
      var idx=(S.plan.days||[]).findIndex(function(x){return x.day===d.day;});
      if(idx>=0)S.plan.days[idx]=newD;savePlanRemote();
      var cell=document.querySelector('.calcell[data-day="'+d.day+'"] .calhook');
      if(cell)cell.textContent=newD.hook||newD.caption||"";
      openDayModal(newD,dateObj,ar);
    }catch(err){
      btn.disabled=false;btn.textContent=rgL;
      errBox.textContent=(ar?"تعذر التوليد: ":"Couldn't regenerate: ")+err.message;
      errBox.style.display="block";
    }
  });
  $id("modalCopyBtn").addEventListener("click",function(){
    var txt=dayCopyText(d,ar);
    navigator.clipboard.writeText(txt).then(function(){var b=$id("modalCopyBtn");b.textContent="✓ "+(ar?"تم النسخ":"Copied");setTimeout(function(){b.textContent=cpL;},1500);}).catch(function(){});
  });
}
function closeDayModal(){var root=$id("dayModalRoot");if(root)root.innerHTML="";}

function buildPrintDetail(p,ar,isRTL){
  var root=$id("printFullDetail");if(!root)return;
  var hL=ar?"الهوك":"HOOK";var iL=ar?"الفكرة":"IDEA";var cL=ar?"الـ CTA":"CTA";var sL=ar?"السكريبت":"SCRIPT";var vL=ar?"التصوير":"SHOT LIST";var tagL=ar?"الهاشتاقات":"HASHTAGS";var timeL=ar?"الوقت":"TIME";
  var startDate=p.startDate?new Date(p.startDate):new Date();
  var html='<div class="printheader">';
  if(S.companyLogo)html+='<img src="'+S.companyLogo+'" style="height:50px;max-width:180px;object-fit:contain;margin-bottom:10px">';
  html+='<h1>'+esc(S.companyName?(ar?"خطة "+S.companyName+" لـ 30 يوم":S.companyName+"'s 30-Day Content Plan"):(ar?"خطة المحتوى لـ 30 يوم":"Your 30-Day Content Plan"))+'</h1>';
  html+='<p class="printsummary">'+esc(p.summary)+'</p></div>';
  (p.days||[]).forEach(function(d){
    var dt=new Date(startDate);dt.setDate(startDate.getDate()+(d.day-1));
    var dateStr=dt.toLocaleDateString(ar?"ar":"en",{weekday:'long',month:'long',day:'numeric'});
    html+='<div class="printday"><div class="printdaytop">'+(ar?"اليوم ":"Day ")+d.day+' — '+esc(dateStr)+' <span class="printfmt">'+esc(d.format||"")+'</span></div>';
    html+='<div class="printfield">'+dayBodyHTML(d,ar)+'</div>';
    if(d.time)html+='<div class="printfield"><b>'+timeL+':</b> '+esc(d.time)+'</div>';
    html+='</div>';
  });
  html+='<div class="printfooter">'+(ar?"من إنتاج Bricks — استوديو بناء الأعمال — bricksmedia.org":"Powered by Bricks — Business Building Studio — bricksmedia.org")+'</div>';
  root.innerHTML=html;
}
render();
</script>
