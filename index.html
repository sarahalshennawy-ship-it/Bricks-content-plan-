<style>

#app{max-width:600px;margin:0 auto;padding:0 0 40px;position:relative}
.hdr{background:#1a1a1a;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-radius:0 0 0 0}

.pr{display:flex;justify-content:space-between;margin-bottom:5px}
.pl{font-size:12px;font-weight:600;color:#764ba2}

.pbar{height:3px;background:#e2e0ea;border-radius:3px;overflow:hidden;margin-bottom:20px}

.gptext{font-size:12px;color:#666;margin-bottom:7px;text-align:center}
.gpbar{height:5px;background:#ddd;border-radius:5px;overflow:hidden}
.gpfill{height:100%;background:#764ba2;border-radius:5px;transition:width 0.4s}
.lp{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:150px 20px 40px;text-align:center}
.corner-lockup{position:absolute;top:24px;left:24px;text-align:left}

.lpc{display:flex;gap:12px;justify-content:center;margin-top:24px}
.lpcbtn{flex:1;max-width:160px;padding:18px 12px;border-radius:12px;border:2px solid rgba(255,255,255,0.35);background:rgba(255,255,255,0.08);cursor:pointer;text-align:center;transition:all 0.15s}
.lpcbtn:hover{border-color:#fff;background:rgba(255,255,255,0.2)}

.wkblk{background:#f1ecfa;border-radius:0 0 8px 8px;padding:7px 7px 2px;margin-bottom:10px}
.dcard{background:#fff;border:1px solid #e2e0ea;border-radius:8px;padding:12px 14px;margin-bottom:6px}

.calmonth{margin-bottom:20px}

.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calwdgrid{margin-bottom:4px}
.calwd{text-align:center;font-size:10px;font-weight:700;color:#888;padding:4px 0}

.calnum{font-size:10px;font-weight:700;color:#1a1a1a;margin-bottom:2px}

.modaloverlay{position:fixed;inset:0;background:rgba(26,26,26,0.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}

.modaldaynum{font-size:18px;font-weight:800;margin-top:2px}

.dtop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.dmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dnum{font-size:12px;font-weight:600;min-width:42px}
.dpill{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600}
.cpbtn{padding:3px 9px;border-radius:6px;border:1px solid #764ba2;background:transparent;color:#764ba2;font-size:10px;cursor:pointer;white-space:nowrap}
.cpbtn.ok{background:#667eea;border-color:#667eea;color:#fff}
.flbl{font-size:10px;font-weight:600;letter-spacing:0.4px;margin-bottom:2px}
.fval{font-size:13px;color:#1a1a1a;line-height:1.5}
.fhook{font-size:13px;font-weight:600;color:#1a1a1a;line-height:1.5}
.fdiv{border:none;border-top:1px solid #ece7f5;margin:6px 0}
.ctabox{background:#764ba2;border-radius:10px;padding:16px;margin-top:4px}
.ctat{font-size:14px;font-weight:600;color:#fff;margin-bottom:4px}
.ctas{font-size:12px;color:rgba(255,255,255,0.85);line-height:1.6}
@media (max-width: 768px){
.lp{padding:120px 16px 30px}
.corner-mark{width:44px;height:55px}
.corner-word{font-size:14px}
.corner-tag{font-size:6px}
.lp-title{font-size:28px}
.g3{grid-template-columns:1fr 1fr}
.lpc{gap:8px}
.lpcbtn{max-width:140px;padding:14px 8px}
.lpcbtn-m{font-size:16px}
.qt{font-size:16px}
.dcard{padding:10px 12px}
.ctabox{padding:14px}
.ctat{font-size:13px}
.ctas{font-size:11px}
.sumcard{padding:14px}
.sumt{font-size:15px}
}
@media (max-width: 400px){
.lp{padding:95px 14px 24px}
.corner-lockup{top:14px;left:14px}
.corner-mark{width:34px;height:43px}
.corner-word{font-size:11px}
.corner-tag{font-size:5px}
.lp-title{font-size:21px}
.g2{grid-template-columns:1fr}
.g3{grid-template-columns:1fr 1fr}
.lo-t{font-size:13px}
.lpcbtn{max-width:130px;padding:12px 6px}
.lpcbtn-m{font-size:15px}
.lpcbtn-s{font-size:10px}
.hb{font-size:14px}
.hs{font-size:9px}
}
.printonly{display:none}
@media print{
body{background:#fff !important}
.no-print{display:none !important}
.calmonth,.sumcard,.pills{display:none !important}
.printonly{display:block !important}
.printheader{text-align:center;margin-bottom:24px;border-bottom:2px solid #764ba2;padding-bottom:16px}
.printheader h1{font-size:22px;color:#1a1a1a;margin-bottom:6px}
.printsummary{font-size:13px;color:#555}
.printday{page-break-inside:avoid;border:1px solid #e2e0ea;border-radius:8px;padding:12px 14px;margin-bottom:10px}
.printdaytop{font-weight:700;font-size:13px;color:#764ba2;margin-bottom:6px}
.printfmt{font-size:10px;color:#667eea;font-weight:700;text-transform:uppercase}
.printfield{font-size:11px;color:#1a1a1a;margin-bottom:4px;line-height:1.4}
.printfooter{text-align:center;font-size:10px;color:#888;margin-top:20px}
}
</style>
</head>

<script>
var DATA={bizTypes:{en:["Medical Aesthetic / Clinic","Salon / Spa / Beauty Center","Gym / Fitness Studio","Restaurant / Café","E-commerce / Products","Abaya / Fashion Brand","Perfume / Luxury Products","Agency / Consulting","Retail Shop","Personal Brand / Creator","Coach / Trainer / Educator","Other Service Business"],ar:["عيادة تجميل طبية","صالون / سبا / مركز تجميل","صالة رياضية / استوديو لياقة","مطعم / كافيه","تجارة إلكترونية / منتجات","براند عبايات / أزياء","عطور / منتجات فاخرة","وكالة / استشارات","متجر بيع بالتجزئة","براند شخصي / كريتور","مدرب / معلم / مستشار","خدمة أخرى"]},goals:{en:["Get more clients / customers","Increase brand awareness","Build authority and trust","Launch a new product or service","Reactivate old customers","Grow social media following"],ar:["جذب عملاء جدد","زيادة الوعي بالبراند","بناء السلطة والمصداقية","إطلاق منتج أو خدمة جديدة","إعادة تنشيط العملاء القدامى","تنمية المتابعين على السوشيال ميديا"]},platforms:{en:["Instagram","TikTok","Snapchat","LinkedIn","X (Twitter)","YouTube Shorts"],ar:["إنستغرام","تيك توك","سناب شات","لينكدإن","تويتر X","يوتيوب شورتس"]},audience:{en:["Women 18–24","Women 25–34","Women 35–44","Women 45–55","Men 18–24","Men 25–34","Men 35–44","Men 45–55","Entrepreneurs","Students / Graduates","Families","High-income professionals","Health-conscious","Fashion & beauty fans","Gulf Arabic audience","Expats in Gulf"],ar:["نساء 18–24","نساء 25–34","نساء 35–44","نساء 45–55","رجال 18–24","رجال 25–34","رجال 35–44","رجال 45–55","رواد أعمال","طلاب وخريجون","أسر ومتزوجون","محترفون ذوو دخل مرتفع","مهتمون بالصحة","عشاق الموضة والجمال","جمهور خليجي عربي","مقيمون في الخليج"]},contentLangs:{en:[{v:"Gulf Arabic",l:"Gulf Arabic",s:"Natural Khaleeji — خليجي طبيعي"},{v:"Neutral Arabic",l:"Arabic — Neutral",s:"Clear Arabic for all Arab countries"},{v:"English",l:"English",s:"International / Gulf English"},{v:"Arabic+English",l:"Arabic + English",s:"Arabic captions with English terms"}],ar:[{v:"Gulf Arabic",l:"عربي خليجي",s:"نبرة خليجية طبيعية"},{v:"Neutral Arabic",l:"عربي بدون لهجة",s:"عربي واضح لجميع الجنسيات"},{v:"English",l:"إنجليزي",s:"مناسب للجمهور الدولي"},{v:"Arabic+English",l:"عربي + إنجليزي",s:"كابشنات عربية مع مصطلحات إنجليزية"}]},questions:{en:[{q:"What's your company name?",h:"This personalizes your plan and calendar"},{q:"What type of business do you run?",h:"Pick up to 2 that match best"},{q:"What is your main goal right now?",h:"Pick up to 2 — the most urgent"},{q:"Where do you post your content?",h:"Select all that apply"},{q:"Who is your target audience?",h:"Select all that apply"},{q:"What language should your content be in?",h:"Hooks and captions will be in this language"},{q:"Describe your business briefly",h:"What do you sell? What makes you different? What city?"}],ar:[{q:"ما اسم شركتك؟",h:"هذا يخصص خطتك وتقويمك باسمك"},{q:"ما نوع بزنسك؟",h:"اختر حتى 2 من الأقرب لطبيعة عملك"},{q:"ما هو هدفك الرئيسي الآن؟",h:"اختر حتى 2 — الأهم والأكثر إلحاحاً"},{q:"وين تنشر محتواك؟",h:"اختر كل ما ينطبق"},{q:"من هو جمهورك المستهدف؟",h:"اختر كل ما ينطبق"},{q:"بأي لغة تريد توليد المحتوى؟",h:"الهوكات والكابشنات ستُكتب بهذه اللغة"},{q:"اوصف بزنسك باختصار",h:"إيش تبيع؟ إيش يميزك؟ في أي مدينة؟"}]},pillars:{en:["Authority","Social Proof","Behind Scenes","Offer","Entertainment"],ar:["سلطة","دليل اجتماعي","كواليس","عرض","ترفيه"]}};
var PC=["#764ba2","#667eea","#ffd700","#4a5fc7","#9a6fd1"];
var FMTS=["Reel","Carousel","Story","Reel","Post"];

// ============================================================
// MONTHLY TRENDS CONFIG — update this by hand, roughly once a month.
// This text gets included in EVERY generation call automatically.
// Keep it short (2-4 lines) — long blocks eat into the prompt budget
// and cost more per generation without adding much value.
// Focus on: trending formats/audio styles, hashtag patterns, and any
// UAE/KSA seasonal moment coming up in the next few weeks
// (Ramadan, National Day, back-to-school, Eid, White Friday, etc.)
// Last updated: [DATE] — set a monthly reminder to revisit this.
// ============================================================
var TRENDS = "Short-form talking-head Reels with on-screen text captions are outperforming polished studio content right now. Carousel posts that open with a bold contrarian statement on slide 1 are getting strong saves. No major Gulf seasonal moment in the immediate window — check back monthly.";

var S={lang:null,step:0,companyName:"",companyLogo:null,biz:[],goal:[],platforms:[],audience:[],cl:"",desc:"",plan:null,loading:false,genPct:0,genMsg:"",error:"",code:"",codeValid:false,codeChecking:false,codeError:""};
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function $id(id){return document.getElementById(id);}
function isAR(){return S.lang==="ar";}
function isValid(){if(S.step===0)return S.companyName.trim()!=="";if(S.step===1)return S.biz.length>0;if(S.step===2)return S.goal.length>0;if(S.step===3)return S.platforms.length>0;if(S.step===4)return S.audience.length>0;if(S.step===5)return S.cl!=="";if(S.step===6)return true;return false;}
function render(){var app=$id("app");app.setAttribute("dir",isAR()?"rtl":"ltr");if(!S.lang){renderLP(app);return;}if(!S.codeValid){renderCodeGate(app);return;}if(S.plan){renderPlan(app);return;}renderQuiz(app);}
function renderLP(app){app.innerHTML='<div class="corner-lockup"><svg class="corner-mark" width="52" height="66" viewBox="0 0 88 110"><rect x="0" y="0" width="34" height="110" rx="6" fill="#764ba2"/><rect x="42" y="0" width="34" height="66" rx="6" fill="#a5b4f5"/><rect x="42" y="74" width="34" height="36" rx="6" fill="#ffd700"/></svg><div class="corner-word">BRICKS</div><div class="corner-tag">MARKETING &amp; BUSINESS SOLUTIONS</div></div><div class="lp"><div class="lp-title">Bricks Content Generator</div><div style="font-size:14px;color:rgba(255,255,255,0.85);margin-bottom:6px">Answer 6 questions — get your full 30-day content plan</div><div style="font-size:13px;color:rgba(255,255,255,0.7)">Choose your language / اختر لغتك</div><div class="lpc"><button class="lpcbtn" id="btnEN"><div class="lpcbtn-m">English</div><div class="lpcbtn-s">Left to right</div></button><button class="lpcbtn" id="btnAR"><div class="lpcbtn-m">العربية</div><div class="lpcbtn-s">من اليمين لليسار</div></button></div></div>';$id("btnEN").addEventListener("click",function(){S.lang="en";render();});$id("btnAR").addEventListener("click",function(){S.lang="ar";render();});}

function renderCodeGate(app){var ar=isAR();
var title=ar?"أدخل رمز الوصول":"Enter your access code";
var sub=ar?"استلمت هذا الرمز في إيميل الشراء. كل رمز يُنشئ خطة واحدة كاملة.":"You received this code with your purchase. Each code generates one full plan.";
var placeholder=ar?"مثال: SARA-XXXX":"e.g. SARA-XXXX";
var btnTxt=S.codeChecking?(ar?"جاري التحقق...":"Checking..."):(ar?"متابعة ←":"Continue →");
app.innerHTML='<div class="corner-lockup"><svg class="corner-mark" width="52" height="66" viewBox="0 0 88 110"><rect x="0" y="0" width="34" height="110" rx="6" fill="#764ba2"/><rect x="42" y="0" width="34" height="66" rx="6" fill="#a5b4f5"/><rect x="42" y="74" width="34" height="36" rx="6" fill="#ffd700"/></svg><div class="corner-word">BRICKS</div><div class="corner-tag">MARKETING &amp; BUSINESS SOLUTIONS</div></div><div class="lp"><div class="lp-title" style="font-size:28px">'+title+'</div><div style="font-size:14px;color:rgba(255,255,255,0.85);margin-bottom:24px;max-width:420px;margin-left:auto;margin-right:auto">'+sub+'</div><input id="codeInput" type="text" placeholder="'+placeholder+'" style="width:100%;max-width:320px;padding:14px 16px;border-radius:10px;border:2px solid rgba(255,255,255,0.35);background:rgba(255,255,255,0.95);font-size:16px;text-align:center;letter-spacing:1px;text-transform:uppercase;margin-bottom:16px" value="'+esc(S.code)+'"><br><button class="lpcbtn" id="codeSubmitBtn" style="flex:none;width:220px;max-width:220px;padding:14px 20px" '+(S.codeChecking?"disabled":"")+'><div class="lpcbtn-m">'+btnTxt+'</div></button>'+(S.codeError?'<div style="margin-top:16px;padding:12px 18px;background:rgba(255,71,87,0.15);border:1.5px solid #ff4757;border-radius:10px;color:#fff;font-size:13px;max-width:420px;margin-left:auto;margin-right:auto">'+esc(S.codeError)+'</div>':'')+'<div style="margin-top:20px;font-size:12px;color:rgba(255,255,255,0.6)">'+(ar?"لا تملك رمزاً؟ تواصل معنا بعد شراء الـ Toolkit.":"Need a code? Contact us after your Toolkit purchase.")+'</div></div>';
var input=$id("codeInput");
var submit=$id("codeSubmitBtn");
function trySubmit(){var val=input.value.trim().toUpperCase();if(!val||S.codeChecking)return;S.code=val;S.codeChecking=true;S.codeError="";render();
fetch("/api/verify-code",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:val})})
.then(function(r){return r.json();})
.then(function(d){S.codeChecking=false;if(d.valid){S.codeValid=true;S.codeError="";}else{S.codeError=d.message||(ar?"رمز غير صالح.":"Invalid code.");}render();})
.catch(function(err){S.codeChecking=false;S.codeError=ar?"تعذر الاتصال. حاول مرة أخرى.":"Couldn't connect. Please try again.";render();});
}
submit.addEventListener("click",trySubmit);
input.addEventListener("keydown",function(e){if(e.key==="Enter")trySubmit();});

    '<button class="cpbtn" id="modalCopyBtn" style="margin-top:16px;width:100%;padding:10px">'+cpL+'</button>'+
    '<button class="btnb" id="modalRegenBtn" style="margin-top:8px;width:100%;padding:10px">'+rgL+'</button>'+
    '<div id="modalRegenError" style="display:none;margin-top:8px;padding:8px 12px;background:rgba(255,71,87,0.1);border:1px solid #ff4757;border-radius:8px;color:#ff4757;font-size:12px"></div>'+
  '</div></div>';
  $id("modalOverlay").addEventListener("click",function(e){if(e.target.id==="modalOverlay")closeDayModal();});
  $id("modalCloseBtn").addEventListener("click",closeDayModal);
  $id("modalRegenBtn").addEventListener("click",async function(){
    var btn=$id("modalRegenBtn");var errBox=$id("modalRegenError");
    btn.disabled=true;btn.textContent=rgLoadL;errBox.style.display="none";
    try{
      var tok=(d.format==="Reel"||d.format==="Carousel")?600:300;
      var raw=await callAPI(makePrompt(d.day,1),tok);
      var newDays=parsePlainText(raw,d.day,1);
      var newD=newDays[0];
      if(!newD||!newD.hook)throw new Error(ar?"لم يتم توليد محتوى صالح":"No valid content came back");
      var idx=(S.plan.days||[]).findIndex(function(x){return x.day===d.day;});
      if(idx>=0)S.plan.days[idx]=newD;
      var cell=document.querySelector('.calcell[data-day="'+d.day+'"] .calhook');
      if(cell)cell.textContent=newD.hook||newD.caption||"";
      openDayModal(newD,dateObj,ar);
    }catch(err){
      btn.disabled=false;btn.textContent=rgL;
      errBox.textContent=(ar?"تعذر التوليد: ":"Couldn't regenerate: ")+err.message;
      errBox.style.display="block";
    }
  });
  $id("modalCopyBtn").addEventListener("click",function(){
    var parts=[d.hook||""];if(d.script)parts.push(d.script);else if(d.caption)parts.push(d.caption);if(d.visual)parts.push((ar?"تصوير: ":"Shot list: ")+d.visual);parts.push(d.cta||"");if(d.hashtags)parts.push(d.hashtags);
    var txt=parts.filter(Boolean).join("\n\n");
    navigator.clipboard.writeText(txt).then(function(){var b=$id("modalCopyBtn");b.textContent="✓ "+(ar?"تم النسخ":"Copied");setTimeout(function(){b.textContent=cpL;},1500);}).catch(function(){});
  });
}
function closeDayModal(){var root=$id("dayModalRoot");if(root)root.innerHTML="";}

function buildPrintDetail(p,ar,isRTL){
  var root=$id("printFullDetail");if(!root)return;
  var hL=ar?"الهوك":"HOOK";var iL=ar?"الفكرة":"IDEA";var cL=ar?"الـ CTA":"CTA";var sL=ar?"السكريبت":"SCRIPT";var vL=ar?"التصوير":"SHOT LIST";var tagL=ar?"الهاشتاقات":"HASHTAGS";var timeL=ar?"الوقت":"TIME";
  var startDate=p.startDate?new Date(p.startDate):new Date();
  var html='<div class="printheader">';
  if(S.companyLogo)html+='<img src="'+S.companyLogo+'" style="height:50px;max-width:180px;object-fit:contain;margin-bottom:10px">';
  html+='<h1>'+esc(S.companyName?(ar?"خطة "+S.companyName+" لـ 30 يوم":S.companyName+"'s 30-Day Content Plan"):(ar?"خطة المحتوى لـ 30 يوم":"Your 30-Day Content Plan"))+'</h1>';
  html+='<p class="printsummary">'+esc(p.summary)+'</p></div>';
  (p.days||[]).forEach(function(d){
    var dt=new Date(startDate);dt.setDate(startDate.getDate()+(d.day-1));
    var dateStr=dt.toLocaleDateString(ar?"ar":"en",{weekday:'long',month:'long',day:'numeric'});
    html+='<div class="printday">';
    html+='<div class="printdaytop">Day '+d.day+' — '+esc(dateStr)+' <span class="printfmt">'+esc(d.format||"")+'</span></div>';
    html+='<div class="printfield"><b>'+hL+':</b> '+esc(d.hook)+'</div>';
    html+='<div class="printfield"><b>'+iL+':</b> '+esc(d.caption)+'</div>';
    if(d.script)html+='<div class="printfield"><b>'+sL+':</b> '+esc(d.script)+'</div>';
    if(d.visual)html+='<div class="printfield"><b>'+vL+':</b> '+esc(d.visual)+'</div>';
    if(d.hashtags)html+='<div class="printfield"><b>'+tagL+':</b> '+esc(d.hashtags)+'</div>';
    html+='<div class="printfield"><b>'+cL+':</b> '+esc(d.cta)+'</div>';
    if(d.time)html+='<div class="printfield"><b>'+timeL+':</b> '+esc(d.time)+'</div>';
    html+='</div>';
  });
  html+='<div class="printfooter">'+(ar?"من إنتاج Bricks — تسويق وحلول أعمال — bricksmedia.org":"Powered by Bricks — Marketing & Business Solutions — bricksmedia.org")+'</div>';
  root.innerHTML=html;
}
render();
</script>
