<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bricks — Access Code Admin</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');
:root{--ink:#2C1F17;--terracotta:#DE7E3D;--gold:#F6C74B;--olive:#85A655;--lavender:#C6A8E8;--cream:#FDF8F4}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}
body{background:var(--cream);min-height:100vh;padding:24px}
#app{max-width:900px;margin:0 auto}
h1{font-family:'Fraunces',serif;font-size:24px;color:var(--ink);margin-bottom:6px}
.sub{font-size:13px;color:#9a8a75;margin-bottom:24px}
.card{background:#fff;border:1px solid #ece1d7;border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 2px 10px rgba(44,31,23,0.05)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label{display:block;font-size:11.5px;font-weight:600;color:var(--ink);margin-bottom:5px}
input{padding:10px 12px;border-radius:8px;border:1.5px solid #e5dad0;font-size:13px;outline:none;width:100%}
input:focus{border-color:var(--terracotta)}
.field{flex:1;min-width:140px}
button{padding:10px 18px;border-radius:8px;border:none;background:linear-gradient(135deg,var(--terracotta),var(--gold));color:#fff;font-weight:600;font-size:13px;cursor:pointer}
button:disabled{opacity:0.4;cursor:not-allowed}
button.secondary{background:#fff;border:1.5px solid #e5dad0;color:var(--ink)}
table{width:100%;border-collapse:collapse;margin-top:8px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.4px;color:#9a8a75;padding:8px 10px;border-bottom:2px solid #ece1d7}
td{padding:10px;font-size:13px;border-bottom:1px solid #f2ebe3;color:var(--ink)}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}
.badge.active{background:#e8f2df;color:var(--olive)}
.badge.used{background:#f0e8f7;color:#8a5fc4}
.badge.expired{background:#fbe4e0;color:#c4432e}
.msg{font-size:12px;margin-top:10px;padding:8px 12px;border-radius:8px}
.msg.ok{background:#e8f2df;color:#4a6b2f}
.msg.err{background:#fbe4e0;color:#a8402e}
.hint{font-size:11px;color:#b0a190;margin-top:4px}
#gate{max-width:380px;margin:80px auto;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
var KEY = "";
var API = "";

function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function fmtDate(iso){if(!iso)return "—";var d=new Date(iso);return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});}

function renderGate(){
  document.getElementById('app').innerHTML =
    '<div id="gate"><h1>Bricks Admin</h1><div class="sub">Enter your admin key to continue</div>' +
    '<div class="card"><label>Admin key</label><input type="password" id="keyInput" placeholder="Your ADMIN_SECRET"><button style="width:100%;margin-top:12px" id="unlockBtn">Unlock</button><div id="gateMsg"></div></div></div>';
  document.getElementById('unlockBtn').onclick = function(){
    KEY = document.getElementById('keyInput').value.trim();
    if(!KEY){return;}
    loadCodes();
  };
}

function renderDashboard(codes, msg){
  var rows = codes.map(function(c){
    return '<tr><td><b>'+esc(c.code)+'</b></td><td>'+c.callsUsed+' / '+c.callsAllowed+'</td>' +
      '<td>'+fmtDate(c.issuedAt)+'</td><td>'+fmtDate(c.expiresAt)+'</td>' +
      '<td><span class="badge '+c.status+'">'+c.status+'</span></td></tr>';
  }).join('');
  if(codes.length===0) rows = '<tr><td colspan="5" style="text-align:center;color:#b0a190;padding:20px">No codes issued yet.</td></tr>';

  document.getElementById('app').innerHTML =
    '<h1>Bricks — Access Code Admin</h1><div class="sub">View and issue Content Plan Generator access codes</div>' +
    '<div class="card"><label>Issue a new code</label><div class="row">' +
    '<div class="field"><label>Code name</label><input id="newCode" placeholder="e.g. CUSTOMER-NAME-01"></div>' +
    '<div class="field"><label>Calls allowed</label><input id="newCalls" type="number" value="4"></div>' +
    '<div class="field"><label>Valid for (days)</label><input id="newDays" type="number" value="30"></div>' +
    '<button id="issueBtn">Issue Code</button></div><div class="hint">Default: 4 calls (one full 30-day plan), valid 30 days.</div>' +
    '<div id="issueMsg"></div></div>' +
    '<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:4px">' +
    '<label style="margin:0">All issued codes ('+codes.length+')</label>' +
    '<button class="secondary" id="refreshBtn">Refresh</button></div>' +
    '<table><thead><tr><th>Code</th><th>Used</th><th>Issued</th><th>Expires</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table>' +
    (msg?('<div class="msg '+msg.type+'">'+esc(msg.text)+'</div>'):'') +
    '</div>';

  document.getElementById('refreshBtn').onclick = loadCodes;
  document.getElementById('issueBtn').onclick = issueCode;
}

async function loadCodes(){
  try{
    var res = await fetch('/api/list-codes', { headers: { 'x-admin-key': KEY } });
    if(res.status===401){renderGate();document.getElementById('gateMsg').innerHTML='<div class="msg err">Wrong key. Try again.</div>';return;}
    var data = await res.json();
    renderDashboard(data.codes||[]);
  }catch(err){
    document.getElementById('app').innerHTML = '<div class="card msg err">Could not load codes: '+esc(err.message)+'</div>';
  }
}

async function issueCode(){
  var code = document.getElementById('newCode').value.trim();
  var calls = parseInt(document.getElementById('newCalls').value) || 4;
  var days = parseInt(document.getElementById('newDays').value) || 30;
  if(!code) return;
  try{
    var res = await fetch('/api/issue-code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-key': KEY },
      body: JSON.stringify({ code: code, callsAllowed: calls, validDays: days })
    });
    var data = await res.json();
    if(!res.ok){
      var reload = await (await fetch('/api/list-codes', { headers: { 'x-admin-key': KEY } })).json();
      renderDashboard(reload.codes||[], { type: 'err', text: data.message || 'That code already exists — pick a different name.' });
      return;
    }
    loadCodes();
  }catch(err){
    document.getElementById('app').innerHTML += '<div class="card msg err">'+esc(err.message)+'</div>';
  }
}

renderGate();
</script>
</body>
</html>
